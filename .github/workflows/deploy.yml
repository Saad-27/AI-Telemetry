name: Deploy

# Runs only after the CI workflow passes for a push to main, so every deployed commit has
# been linted and tested. ADR 0006 explains the flow; docs/deploy.md lists the settings it needs.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # manual redeploy of main

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  production:
    # Off until the PRODUCTION_ENABLED repo variable is "true" (after docs/deploy.md setup).
    # The `production` environment's required reviewer (you) approves each run in the Actions
    # tab before it starts. There is no staging (ADR 0006), so that approval is the last check.
    # workflow_run fires for pull requests too, and `branches` matches a fork's branch named
    # "main", so also require a push from this repository.
    if: >-
      vars.PRODUCTION_ENABLED == 'true' && (
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      - name: Deploy the worker, which runs the migrations first
        # The worker alone holds the schema owner's connection string (ADR 0026), so it goes
        # first: a failed migration stops the run before the ingest app changes. Each app has
        # its own deploy token. The builder caches layers, so the second build is quick.
        run: >-
          flyctl deploy server
          --config "$GITHUB_WORKSPACE/deploy/fly/worker.toml"
          --remote-only --ha=false
          --image-label "git-${SHA::12}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_WORKER_API_TOKEN }}
      - name: Deploy
        # --ha=false: one machine until real traffic needs more (ADR 0007).
        run: >-
          flyctl deploy server
          --config "$GITHUB_WORKSPACE/deploy/fly/production.toml"
          --remote-only --ha=false
          --image-label "git-${SHA::12}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test
        # /readyz also proves the app can reach its database. The retries (~30 s) cover the
        # cold start of a sleeping machine and Neon compute.
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "$PUBLIC_URL/readyz"
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
