# Production, the only hosted environment (ADR 0006). Deployed after CI passes on main AND
# you approve the run in GitHub (the `production` environment). Off until the
# PRODUCTION_ENABLED repo variable is "true". Until M3 splits ingest and web-api into separate
# apps, this one app serves both hostnames. Secrets (DATABASE_URL, ...) are never in this
# file: set them with `fly secrets set -a gaslit-api-production`. See docs/deploy.md. The
# worker app (worker.toml) runs migrations and upkeep.

app = "gaslit-api-production"
primary_region = "fra" # D12: EU-hosted

[build]
  # Relative to the directory passed to `fly deploy` (server/), which is also the build context.
  dockerfile = "Dockerfile"

[env]
  METRICS_PORT = "9091"

# Prometheus metrics (ADR 0021). Fly scrapes this port every 15 s over its private network
# into its managed Prometheus, with Grafana at fly-metrics.net (free, checked 2026-10-18). The
# port is not in [http_service], so it is never reachable from the internet.
[metrics]
  port = 9091
  path = "/metrics"

# No release_command: migrations need the schema owner, whose connection string only the
# worker app has (worker.toml, ADR 0026). This app's DATABASE_URL can only write.

[http_service]
  internal_port = 8000
  force_https = true
  # Scale to zero (ADR 0007): no machine runs, and nothing is billed, while there is no
  # traffic. The first request after a quiet spell waits a few seconds for a cold start. Raise
  # this to 1 once real users would notice. The deploy passes --ha=false for one machine.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  # Liveness only. /readyz (database reachable) is checked by the deploy smoke test instead,
  # so a database blip does not make Fly restart healthy machines.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "3s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  # The smallest size. The load test peaked at 104 MB, and 166 MB under a flood (docs/capacity.md).
  # CPU, not memory, limits this machine: 6.25% of a core once its burst balance is spent.
  memory = "256mb"
