[project]
name = "server"
version = "0.0.0"
description = "Ingest and dashboard API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "asyncpg",
    "alembic>=1.20.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = ["pytest", "httpx2", "mypy", "ruff"]

[tool.uv]
package = false

[tool.ruff]
extend = "../ruff.toml"

[tool.mypy]
strict = true
files = ["app", "migrations", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: needs Postgres (DATABASE_URL, or the compose database)"]
